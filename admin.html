<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAC Admin Dashboard</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-row">
    <img id="logoImg" alt="GAC logo">
    <div><h1>GAC Fleet Checklists</h1><div class="sub">Admin Dashboard</div></div>
  </div>
</header>
<main id="main"></main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="logo.js"></script>
<script src="templates.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('logoImg').src = LOGO_DATA_URI;
// Change this PIN before sharing the admin link with anyone.
const ADMIN_PIN = "4256";
let records=[], adminFilter='all', issuesOnly=false, editingId=null;

function gate(){
  const h=`<div class="card" style="max-width:320px;margin:60px auto">
    <h2 class="section">Admin Access</h2>
    <div class="field"><input type="password" id="pin" placeholder="Enter PIN"></div>
    <button class="btn red block" id="pinBtn">Unlock</button>
  </div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('pinBtn').onclick=()=>{
    if(document.getElementById('pin').value===ADMIN_PIN){ renderDashboard(); }
    else { toast('Incorrect PIN'); }
  };
  document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('pinBtn').click(); });
}

async function loadRecords(){ records = await fsList(500); }

async function renderDashboard(){
  editingId=null;
  document.getElementById('main').innerHTML='<div class="card muted">Loading…</div>';
  await loadRecords();
  const equips=[...new Set(records.map(r=>r.equip))];
  let list=records.filter(r=> (adminFilter==='all'||r.equip===adminFilter) && (!issuesOnly||r.notOkCount>0) );
  let h=`<div class="card"><div class="row"><h2 class="section" style="margin:0">Submissions (${list.length}/${records.length})</h2><div class="sp"></div>
   <button class="btn ghost sm no-print" id="exportBtn">Export CSV</button></div>
   <div class="chip-row no-print" style="margin-top:12px">
    <button class="chip ${adminFilter==='all'?'sel':''}" data-eq="all">All</button>
    ${equips.map(e=>`<button class="chip ${adminFilter===e?'sel':''}" data-eq="${e}">${TEMPLATES[e]?TEMPLATES[e].label:e}</button>`).join('')}
    <button class="chip ${issuesOnly?'sel':''}" id="issuesToggle">⚠ Issues only</button>
   </div></div>`;
  if(!list.length) h+='<div class="card empty">No checklists match.</div>';
  list.forEach(r=>{
    h+=`<div class="rec" data-id="${r.id}"><div class="row"><div class="t1">${escHtml(r.equipLabel)} — ${escHtml(r.title)}</div><div class="sp"></div>
      <span class="badge ${r.notOkCount>0?'b-bad':'b-ok'}">${r.notOkCount>0? r.notOkCount+' issue(s)':'All OK'}</span></div>
      <div class="t2">${escHtml(r.code)} · Eqpt No: ${escHtml(r.eqptNo)||'—'} · ${escHtml(r.date)||''} · by ${escHtml(r.mechanic)||'—'}</div></div>`;
  });
  document.getElementById('main').innerHTML=h;
  document.querySelectorAll('.rec').forEach(el=>el.onclick=()=>renderRecordView(records.find(r=>r.id===el.dataset.id)));
  document.getElementById('exportBtn').onclick=exportCSV;
  document.querySelectorAll('.chip[data-eq]').forEach(b=>b.onclick=()=>{adminFilter=b.dataset.eq;renderDashboard();});
  document.getElementById('issuesToggle').onclick=()=>{issuesOnly=!issuesOnly;renderDashboard();};
}

function renderRecordView(r){
  let rows=r.items.map((it,i)=>`<tr><td>${i+1}</td><td>${escHtml(it.desc)}</td><td style="text-align:center">${escHtml(it.cond)||'-'}</td><td>${escHtml(it.findings)||''}</td></tr>`).join('');
  let h=`<div class="card no-print"><div class="row"><button class="btn ghost sm" id="backA">&larr; Back</button><div class="sp"></div>
    <button class="btn ghost sm" id="editBtn">Edit</button>
    <button class="btn danger-ghost sm" id="delBtn">Delete</button>
    <button class="btn sm" id="printBtn">Print / Save PDF</button></div></div>
   <div class="card">
    <h2 style="color:var(--text);font-size:18px;margin:0 0 4px">GULF ASIA CONTRACTING COMPANY</h2>
    <div class="muted">${escHtml(r.title)} — ${escHtml(r.code)}</div>
    <div class="grid" style="margin-top:12px">
      <div>Eqpt No: <b>${escHtml(r.eqptNo)||'—'}</b></div><div>Eqpt Code: <b>${escHtml(r.eqptCode)||'—'}</b></div>
      <div>Make: <b>${escHtml(r.make)||'—'}</b></div><div>Model: <b>${escHtml(r.model)||'—'}</b></div>
      <div>Engine Make: <b>${escHtml(r.engMake)||'—'}</b></div><div>Engine Model: <b>${escHtml(r.engModel)||'—'}</b></div>
      <div>KMR/HMR: <b>${escHtml(r.kmr)||'—'}</b></div><div>Date: <b>${escHtml(r.date)||'—'}</b></div>
    </div>
    <table style="margin-top:16px"><tr><th>#</th><th>Description</th><th>Condition</th><th>Findings/Action</th></tr>${rows}</table>
    <div style="margin-top:14px"><b>Remarks:</b> ${escHtml(r.remarks)||'—'}</div>
    <div class="grid" style="margin-top:14px">
      <div>Mechanic: <b>${escHtml(r.mechanic)||'—'}</b></div><div>Operator: <b>${escHtml(r.operator)||'—'}</b></div>
      <div>Supervisor: <b>${escHtml(r.supervisor)||'—'}</b></div><div>Reviewed By: <b>${escHtml(r.reviewedBy)||'—'}</b></div>
    </div>
   </div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('backA').onclick=renderDashboard;
  document.getElementById('printBtn').onclick=()=>window.print();
  document.getElementById('editBtn').onclick=()=>renderEditForm(r);
  document.getElementById('delBtn').onclick=async()=>{
    const ok=await confirmDialog('Delete this checklist?','This cannot be undone.');
    if(!ok) return;
    try{ await fsDelete(r.id); toast('Deleted'); renderDashboard(); }catch(e){ toast('Delete failed'); }
  };
}

function renderEditForm(r){
  editingId=r.id;
  const tpl = TEMPLATES[r.equip] ? TEMPLATES[r.equip].tpls.find(t=>t.code===r.code) : null;
  const items = tpl ? tpl.items : r.items.map(it=>it.desc);
  let h=`<div class="card"><button class="btn ghost sm" id="backE">&larr; Cancel</button></div>
  <div class="card"><h2 class="section">${escHtml(r.equipLabel)} — ${escHtml(r.title)} (${escHtml(r.code)})</h2>
    ${headerFieldsHtml(r)}
  </div>
  <div class="card"><h2 class="section">Checklist Items</h2>
    <div class="progress"><div id="progBar" style="width:0%"></div></div>
    <div class="muted" id="progLabel" style="margin:6px 0 12px"></div>
    <div id="itemsWrap">${itemsBlockHtml(items, r.items)}</div>
  </div>
  <div class="card"><h2 class="section">Remarks</h2><textarea id="fRemarks">${escHtml(r.remarks||'')}</textarea></div>
  <div class="card"><h2 class="section">Sign Off</h2>${signoffFieldsHtml(r)}
    <button class="btn red block" id="saveEditBtn" style="margin-top:10px">Save Changes</button>
  </div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('backE').onclick=()=>renderRecordView(r);
  attachValidation();
  wireItemButtons(document.getElementById('itemsWrap'));
  document.getElementById('saveEditBtn').onclick=async()=>{
    if(!validateAllFields()){ toast('Please fix the highlighted fields'); return; }
    const btn=document.getElementById('saveEditBtn'); btn.disabled=true; btn.textContent='Saving…';
    const itemsData=collectItems(items, document.getElementById('itemsWrap'));
    const notOk=itemsData.filter(x=>x.cond==='NOTOK').length;
    const upd={
      eqptNo:val('fEqptNo'),eqptCode:val('fEqptCode'),make:val('fMake'),model:val('fModel'),
      engMake:val('fEngMake'),engModel:val('fEngModel'),kmr:val('fKmr'),date:val('fDate'),
      items:itemsData, remarks:val('fRemarks'),
      mechanic:val('fMech'),operator:val('fOper'),supervisor:val('fSup'),reviewedBy:val('fRev'),
      notOkCount:notOk, updatedAt:new Date().toISOString()
    };
    try{ await fsUpdate(editingId, upd); toast('Checklist updated'); renderDashboard(); }
    catch(e){ toast('Save failed'); btn.disabled=false; btn.textContent='Save Changes'; }
  };
}

function exportCSV(){
  if(!records.length){ toast('No records to export'); return; }
  const esc=v=>String(v==null?'':v).replace(/"/g,'""');
  let csv='Equipment,Checklist,Code,EqptNo,Date,Mechanic,Supervisor,IssuesFound\n';
  records.forEach(r=>{
    csv+=`"${esc(r.equipLabel)}","${esc(r.title)}","${esc(r.code)}","${esc(r.eqptNo)}","${esc(r.date)}","${esc(r.mechanic)}","${esc(r.supervisor)}",${r.notOkCount}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='gac_checklists_export.csv'; a.click();
}

gate();
</script>
</body>
</html>
