<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAC Admin Dashboard</title>
<style>
:root{
  --navy:#0f2a43; --amber:#e69b12; --ok:#1f8a4c; --notok:#c2392b;
  --bg:#f2f4f6; --card:#ffffff; --text:#101720; --sub:#5b6472; --line:#dde3e9;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#0c1116; --card:#141b23; --text:#e8edf2; --sub:#93a0ad; --line:#26313c; } }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
header{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px;}
header h1{margin:0;font-size:17px;}
main{max-width:820px;margin:0 auto;padding:16px 14px 60px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
h2{font-size:15px;margin:0 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14.5px;}
.btn{padding:11px 16px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:7px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--text);}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer;}
.rec .t1{font-weight:700;font-size:14.5px;}
.rec .t2{font-size:12.5px;color:var(--sub);margin-top:2px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;}
.b-ok{background:var(--ok);} .b-bad{background:var(--notok);}
.muted{color:var(--sub);font-size:13px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sp{flex:1;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px;border:1px solid var(--line);text-align:left;}
@media print{ header,.no-print{display:none !important;} body{background:#fff;color:#000;} }
</style>
</head>
<body>
<header><h1>GAC Admin Dashboard</h1></header>
<main id="main"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="templates.js"></script>
<script src="firebase-config.js"></script>
<script>
// Change this PIN before sharing the admin link with anyone.
const ADMIN_PIN = "4256";
let records=[], adminFilter='all', issuesOnly=false;

function gate(){
  const h=`<div class="card" style="max-width:320px;margin:60px auto">
    <h2>Admin Access</h2>
    <input type="password" id="pin" placeholder="Enter PIN" style="margin-bottom:10px">
    <button class="btn" id="pinBtn" style="width:100%">Unlock</button>
  </div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('pinBtn').onclick=()=>{
    if(document.getElementById('pin').value===ADMIN_PIN){ renderDashboard(); }
    else { alert('Incorrect PIN'); }
  };
  document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('pinBtn').click(); });
}

async function loadRecords(){
  const snap = await db.collection('checklists').orderBy('submittedAt','desc').limit(500).get();
  records = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function renderDashboard(){
  await loadRecords();
  const equips=[...new Set(records.map(r=>r.equip))];
  let list=records.filter(r=> (adminFilter==='all'||r.equip===adminFilter) && (!issuesOnly||r.notOkCount>0) );
  let h=`<div class="card"><div class="row"><h2 style="margin:0">Submissions (${list.length}/${records.length})</h2><div class="sp"></div>
   <button class="btn sm ghost no-print" id="exportBtn">Export CSV</button></div>
   <div class="chip-row no-print" style="margin-top:10px">
    <button class="chip ${adminFilter==='all'?'sel':''}" data-eq="all">All</button>
    ${equips.map(e=>`<button class="chip ${adminFilter===e?'sel':''}" data-eq="${e}">${TEMPLATES[e]?TEMPLATES[e].label:e}</button>`).join('')}
    <button class="chip ${issuesOnly?'sel':''}" id="issuesToggle">⚠ Issues only</button>
   </div></div>`;
  if(!list.length) h+='<div class="card muted">No checklists match.</div>';
  list.forEach(r=>{
    h+=`<div class="rec" data-id="${r.id}"><div class="row"><div class="t1">${r.equipLabel} — ${r.title}</div><div class="sp"></div>
      <span class="badge ${r.notOkCount>0?'b-bad':'b-ok'}">${r.notOkCount>0? r.notOkCount+' issue(s)':'All OK'}</span></div>
      <div class="t2">${r.code} · Eqpt No: ${r.eqptNo||'—'} · ${r.date||''} · by ${r.mechanic||'—'}</div></div>`;
  });
  document.getElementById('main').innerHTML=h;
  document.querySelectorAll('.rec').forEach(el=>el.onclick=()=>renderRecordView(records.find(r=>r.id===el.dataset.id)));
  document.getElementById('exportBtn').onclick=exportCSV;
  document.querySelectorAll('.chip[data-eq]').forEach(b=>b.onclick=()=>{adminFilter=b.dataset.eq;renderDashboard();});
  document.getElementById('issuesToggle').onclick=()=>{issuesOnly=!issuesOnly;renderDashboard();};
}

function renderRecordView(r){
  let rows=r.items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.desc}</td><td style="text-align:center">${it.cond||'-'}</td><td>${it.findings||''}</td></tr>`).join('');
  let h=`<div class="card no-print"><div class="row"><button class="btn ghost sm" id="backA">&larr; Back</button><div class="sp"></div>
    <button class="btn sm" id="printBtn">Print / Save PDF</button></div></div>
   <div class="card">
    <h2 style="color:var(--text);font-size:18px">GULF ASIA CONTRACTING COMPANY</h2>
    <div class="muted">${r.title} — ${r.code}</div>
    <div class="grid" style="margin-top:10px">
      <div>Eqpt No: <b>${r.eqptNo||'—'}</b></div><div>Eqpt Code: <b>${r.eqptCode||'—'}</b></div>
      <div>Make: <b>${r.make||'—'}</b></div><div>Model: <b>${r.model||'—'}</b></div>
      <div>Engine Make: <b>${r.engMake||'—'}</b></div><div>Engine Model: <b>${r.engModel||'—'}</b></div>
      <div>KMR/HMR: <b>${r.kmr||'—'}</b></div><div>Date: <b>${r.date||'—'}</b></div>
    </div>
    <table style="margin-top:14px"><tr><th>#</th><th>Description</th><th>Condition</th><th>Findings/Action</th></tr>${rows}</table>
    <div style="margin-top:12px"><b>Remarks:</b> ${r.remarks||'—'}</div>
    <div class="grid" style="margin-top:12px">
      <div>Mechanic: <b>${r.mechanic||'—'}</b></div><div>Operator: <b>${r.operator||'—'}</b></div>
      <div>Supervisor: <b>${r.supervisor||'—'}</b></div><div>Reviewed By: <b>${r.reviewedBy||'—'}</b></div>
    </div>
   </div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('backA').onclick=renderDashboard;
  document.getElementById('printBtn').onclick=()=>window.print();
}

function esc(v){return String(v==null?'':v).replace(/"/g,'""');}
function exportCSV(){
  if(!records.length){ alert('No records to export'); return; }
  let csv='Equipment,Checklist,Code,EqptNo,Date,Mechanic,Supervisor,IssuesFound\n';
  records.forEach(r=>{
    csv+=`"${esc(r.equipLabel)}","${esc(r.title)}","${esc(r.code)}","${esc(r.eqptNo)}","${esc(r.date)}","${esc(r.mechanic)}","${esc(r.supervisor)}",${r.notOkCount}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='gac_checklists_export.csv'; a.click();
}

gate();
</script>
</body>
</html>
